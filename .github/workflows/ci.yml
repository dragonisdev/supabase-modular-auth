name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  FRONTEND_PROXY_TARGET: http://127.0.0.1:3000
  NEXT_PUBLIC_API_BASE_URL: ""

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check workspaces
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Type-check tests
        run: pnpm test:type-check

      - name: Check generated OpenAPI contract
        run: pnpm api:check

      - name: Validate Docker Compose configuration
        run: pnpm compose:check

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Build production packages
        run: pnpm build

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  containers:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag supabase-saas-backend:ci .

      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag supabase-saas-frontend:ci .

  database:
    name: Supabase migration and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ALLOW_DATABASE_CLUSTER_MUTATIONS: "true"
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase database and apply migrations
        id: supabase-start
        run: pnpm supabase:start

      - name: Check declarative schema for migration drift
        run: pnpm supabase:schema:check

      - name: Lint Supabase schema
        run: pnpm supabase:lint

      - name: Run Supabase pgTAP security tests
        run: pnpm supabase:test

      - name: Verify migration behavior in a disposable database
        run: pnpm test:database

      - name: Stop Supabase database
        if: ${{ always() && steps.supabase-start.outcome == 'success' }}
        run: pnpm supabase:stop
